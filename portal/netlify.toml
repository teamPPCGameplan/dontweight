[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Optimize functions
[functions]
  node_bundler = "esbuild"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "frame-ancestors 'none'"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts
[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Landing pages - clean URLs
[[redirects]]
  from = "/join"
  to = "/join.html"
  status = 200

[[redirects]]
  from = "/join-b"
  to = "/join-b.html"
  status = 200

[[redirects]]
  from = "/join-c"
  to = "/join-c.html"
  status = 200

[[redirects]]
  from = "/join-d"
  to = "/join-d.html"
  status = 200

[[redirects]]
  from = "/join-e"
  to = "/join-e.html"
  status = 200

[[redirects]]
  from = "/join-f"
  to = "/join-f.html"
  status = 200

[[redirects]]
  from = "/join-g"
  to = "/join-g.html"
